<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho — Bela Rosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/carrinho.css">
</head>
<body>

<header class="c-header">
  <a href="index.html" class="c-logo">Bela Rosa</a>
  <a href="index.html" class="c-back">← Continuar comprando</a>
</header>

<main class="c-main">

  <!-- ── Itens ───────────────────────────── -->
  <section class="c-itens" id="c-itens">
    <h2 class="c-titulo">Seu carrinho</h2>
    <div id="lista-itens"></div>

    <!-- Vazio -->
    <div class="c-vazio" id="c-vazio" style="display:none">
      <span class="c-vazio-icon">◌</span>
      <p>Seu carrinho está vazio.</p>
      <a href="index.html" class="btn-continuar">Ver produtos</a>
    </div>
  </section>

  <!-- ── Resumo + Checkout ────────────────── -->
  <aside class="c-resumo" id="c-resumo">
    <h3>Resumo do pedido</h3>

    <div class="resumo-linha">
      <span>Subtotal</span>
      <span id="r-subtotal">R$ 0,00</span>
    </div>
    <div class="resumo-linha">
      <span>Frete</span>
      <span class="r-frete" id="r-frete">Calculando…</span>
    </div>
    <div class="resumo-linha resumo-total">
      <span>Total</span>
      <span id="r-total">R$ 0,00</span>
    </div>

    <!-- CEP -->
    <div class="cep-wrap">
      <input type="text" id="cep-input" placeholder="Digite seu CEP" maxlength="9">
      <button id="cep-btn">OK</button>
    </div>
    <p class="cep-info" id="cep-info"></p>

    <div class="p-divider"></div>

    <!-- Dados do comprador -->
    <div class="campo">
      <label>Nome completo</label>
      <input type="text" id="c-nome" placeholder="Seu nome">
    </div>
    <div class="campo">
      <label>E-mail</label>
      <input type="email" id="c-email" placeholder="seu@email.com">
    </div>
    <div class="campo">
      <label>CPF</label>
      <input type="text" id="c-cpf" placeholder="000.000.000-00" maxlength="14">
    </div>
    <div class="campo">
      <label>Telefone</label>
      <input type="text" id="c-tel" placeholder="(21) 99999-9999" maxlength="15">
    </div>

    <div class="p-divider"></div>

    <!-- Método de pagamento -->
    <p class="pagamento-titulo">Forma de pagamento</p>
    <div class="metodos">
      <label class="metodo" id="metodo-pix">
        <input type="radio" name="pagamento" value="pix" checked>
        <span class="metodo-inner">
          <svg width="28" height="28" viewBox="0 0 512 512" fill="none"><path d="M314.6 64c-13.4 0-26 5.2-35.4 14.6l-97.6 97.6c-3.1 3.1-7.2 4.9-11.6 4.9s-8.5-1.7-11.6-4.9L61 79c-9.5-9.5-22-14.7-35.4-14.7H16l128.2 128.2a64.3 64.3 0 0 0 90.8 0L363.2 64h-48.6z" fill="#32BCAD"/><path d="M486 176.3l-61.8-61.8c0 0 0 0 0 0l-46.9-46.9c0 0 0 0 0 0L349 39.3A64.3 64.3 0 0 0 263 39l-17.9 17.9 65.2 65.2a96.3 96.3 0 0 1 0 136.2L243 325.5l-61.2 61.2a96.3 96.3 0 0 1-136.2 0L26 367.1 26 367.1l0 0L26 367a64.3 64.3 0 0 0 0 90.8l17.9 17.9a64.3 64.3 0 0 0 90.8 0l62.6-62.6 67.4-67.4a32 32 0 0 1 45.3 0l67.4 67.4 62.6 62.6a64.3 64.3 0 0 0 90.8 0l17.9-17.9a64.3 64.3 0 0 0 0-90.8l-19.6-19.6 19.6-19.6a64.3 64.3 0 0 0 0-90.8L486 176.3z" fill="#32BCAD"/></svg>
          PIX
          <em>Instantâneo</em>
        </span>
      </label>
      <label class="metodo" id="metodo-cartao">
        <input type="radio" name="pagamento" value="cartao">
        <span class="metodo-inner">
          <svg width="28" height="20" viewBox="0 0 28 20" fill="none"><rect width="28" height="20" rx="3" fill="#1a1a1a"/><rect y="4" width="28" height="5" fill="#c8a96e"/><rect x="3" y="13" width="8" height="2" rx="1" fill="#fff" opacity=".5"/></svg>
          Cartão
          <em>Crédito / Débito</em>
        </span>
      </label>
    </div>

    <!-- Cartão fields -->
    <div id="campos-cartao" style="display:none">
      <div class="campo">
        <label>Número do cartão</label>
        <input type="text" id="cc-num" placeholder="0000 0000 0000 0000" maxlength="19">
      </div>
      <div class="campo-row">
        <div class="campo">
          <label>Validade</label>
          <input type="text" id="cc-val" placeholder="MM/AA" maxlength="5">
        </div>
        <div class="campo">
          <label>CVV</label>
          <input type="text" id="cc-cvv" placeholder="123" maxlength="4">
        </div>
      </div>
      <div class="campo">
        <label>Nome no cartão</label>
        <input type="text" id="cc-nome" placeholder="Como está no cartão">
      </div>
      <div class="campo">
        <label>Parcelas</label>
        <select id="cc-parcelas">
          <option value="1">1× sem juros</option>
          <option value="2">2× sem juros</option>
          <option value="3">3× sem juros</option>
          <option value="6">6× sem juros</option>
          <option value="12">12× sem juros</option>
        </select>
      </div>
    </div>

    <button class="btn-pagar" id="btn-pagar">
      <span id="btn-pagar-texto">Finalizar pedido</span>
    </button>

    <p class="seguranca">🔒 Pagamento 100% seguro via Mercado Pago</p>

    <!-- QR Code PIX (aparece após clique) -->
    <div class="pix-resultado" id="pix-resultado" style="display:none">
      <h4>Pague com PIX</h4>
      <div class="qr-wrap">
        <div id="qr-code"></div>
      </div>
      <p class="pix-instrucao">Escaneie o QR Code ou copie o código abaixo:</p>
      <div class="pix-copia-wrap">
        <input type="text" id="pix-codigo" readonly>
        <button id="btn-copiar">Copiar</button>
      </div>
      <p class="pix-validade" id="pix-validade"></p>
    </div>
  </aside>

</main>

<script src="javascript/carrinho.js"></script>
<script src="javascript/checkout.js"></script>
</body>
</html>
