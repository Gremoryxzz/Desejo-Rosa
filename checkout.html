<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Desejo Rosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/checkout.css">
</head>
<body>

<header class="ck-header">
  <!-- Logo com ícone -->
  <a href="index.html" class="ck-logo">
    <img src="topo.png" alt="Desejo Rosa" style="height:36px;border-radius:4px;vertical-align:middle;display:block;">
  </a>
  <div class="ck-steps">
    <span class="step done">Carrinho</span>
    <span class="step-arrow">›</span>
    <span class="step active">Pagamento</span>
    <span class="step-arrow">›</span>
    <span class="step">Confirmação</span>
  </div>
  <a href="carrinho.html" class="ck-back">← Voltar ao carrinho</a>
</header>

<main class="ck-main">

  <!-- Resumo do pedido -->
  <aside class="ck-resumo">
    <h3>Seu pedido</h3>
    <div id="ck-itens-lista"></div>
    <div class="ck-linha ck-linha-sub">
      <span>Subtotal</span>
      <span id="ck-subtotal">R$ 0,00</span>
    </div>
    <div class="ck-linha">
      <span>Frete</span>
      <span id="ck-frete" class="frete-calc">Calcule abaixo</span>
    </div>
    <div class="ck-linha ck-total">
      <span>Total</span>
      <span id="ck-total">R$ 0,00</span>
    </div>
    <p class="ck-seguro">🔒 Compra 100% segura</p>
  </aside>

  <!-- Formulário -->
  <section class="ck-form">

    <!-- Dados pessoais -->
    <div class="ck-bloco">
      <h4 class="ck-bloco-titulo"><span class="num">1</span> Seus dados</h4>
      <div class="ck-campos">
        <div class="ck-campo full">
          <label>Nome completo</label>
          <input type="text" id="ck-nome" placeholder="Seu nome completo">
        </div>
        <div class="ck-campo">
          <label>E-mail</label>
          <input type="email" id="ck-email" placeholder="seu@email.com">
        </div>
        <div class="ck-campo">
          <label>CPF</label>
          <input type="text" id="ck-cpf" placeholder="000.000.000-00" maxlength="14">
        </div>
        <div class="ck-campo">
          <label>Telefone / WhatsApp</label>
          <input type="text" id="ck-tel" placeholder="(21) 99999-9999" maxlength="15">
        </div>
      </div>
    </div>

    <!-- Entrega -->
    <div class="ck-bloco">
      <h4 class="ck-bloco-titulo"><span class="num">2</span> Entrega</h4>
      <div class="ck-cep-wrap">
        <input type="text" id="ck-cep" placeholder="Digite seu CEP" maxlength="9">
        <button id="ck-cep-btn">Calcular</button>
      </div>
      <p class="ck-cep-info" id="ck-cep-info"></p>

      <div id="ck-endereco-campos" class="ck-campos ck-endereco-oculto">
        <div class="ck-campo full">
          <label>Logradouro (Rua / Av.)</label>
          <input type="text" id="ck-rua" placeholder="Ex: Rua das Flores">
        </div>
        <div class="ck-campo ck-campo-num">
          <label>Número</label>
          <input type="text" id="ck-numero" placeholder="Ex: 123">
        </div>
        <div class="ck-campo ck-campo-comp">
          <label>Complemento <span class="opcional">(opcional)</span></label>
          <input type="text" id="ck-complemento" placeholder="Apto, Bloco, Casa…">
        </div>
        <div class="ck-campo">
          <label>Bairro</label>
          <input type="text" id="ck-bairro" placeholder="Seu bairro">
        </div>
        <div class="ck-campo">
          <label>Ponto de referência <span class="opcional">(opcional)</span></label>
          <input type="text" id="ck-referencia" placeholder="Ex: Próximo ao mercado">
        </div>
        <div class="ck-campo">
          <label>Cidade</label>
          <input type="text" id="ck-cidade" placeholder="Sua cidade" readonly>
        </div>
        <div class="ck-campo">
          <label>Estado</label>
          <input type="text" id="ck-uf" placeholder="UF" maxlength="2" readonly>
        </div>
      </div>
    </div>

    <!-- Pagamento -->
    <div class="ck-bloco">
      <h4 class="ck-bloco-titulo"><span class="num">3</span> Pagamento</h4>
      <div class="ck-metodos">
        <label class="ck-metodo" id="m-pix">
          <input type="radio" name="pagamento" value="pix" checked>
          <div class="ck-metodo-inner">
            <svg width="26" height="26" viewBox="0 0 512 512" fill="none">
              <path d="M314.6 64c-13.4 0-26 5.2-35.4 14.6l-97.6 97.6c-3.1 3.1-7.2 4.9-11.6 4.9s-8.5-1.7-11.6-4.9L61 79c-9.5-9.5-22-14.7-35.4-14.7H16l128.2 128.2a64.3 64.3 0 0 0 90.8 0L363.2 64h-48.6z" fill="#32BCAD"/>
              <path d="M486 176.3l-61.8-61.8-46.9-46.9L349 39.3A64.3 64.3 0 0 0 263 39l-17.9 17.9 65.2 65.2a96.3 96.3 0 0 1 0 136.2L243 325.5l-61.2 61.2a96.3 96.3 0 0 1-136.2 0L26 367.1a64.3 64.3 0 0 0 0 90.8l17.9 17.9a64.3 64.3 0 0 0 90.8 0l62.6-62.6 67.4-67.4a32 32 0 0 1 45.3 0l67.4 67.4 62.6 62.6a64.3 64.3 0 0 0 90.8 0l17.9-17.9a64.3 64.3 0 0 0 0-90.8l-19.6-19.6 19.6-19.6a64.3 64.3 0 0 0 0-90.8z" fill="#32BCAD"/>
            </svg>
            <strong>PIX</strong>
            <small>Aprovação imediata</small>
          </div>
        </label>
        <label class="ck-metodo" id="m-cartao">
          <input type="radio" name="pagamento" value="cartao">
          <div class="ck-metodo-inner">
            <svg width="28" height="20" viewBox="0 0 28 20" fill="none">
              <rect width="28" height="20" rx="3" fill="#1a1a1a"/>
              <rect y="4" width="28" height="5" fill="#c8a96e"/>
              <rect x="3" y="13" width="8" height="2" rx="1" fill="#fff" opacity=".5"/>
            </svg>
            <strong>Cartão</strong>
            <small>Crédito / Débito</small>
          </div>
        </label>
      </div>

      <div id="campos-cartao" style="display:none" class="ck-campos">
        <div class="ck-campo full">
          <label>Número do cartão</label>
          <input type="text" id="cc-num" placeholder="0000 0000 0000 0000" maxlength="19">
        </div>
        <div class="ck-campo">
          <label>Validade</label>
          <input type="text" id="cc-val" placeholder="MM/AA" maxlength="5">
        </div>
        <div class="ck-campo">
          <label>CVV</label>
          <input type="text" id="cc-cvv" placeholder="123" maxlength="4">
        </div>
        <div class="ck-campo full">
          <label>Nome no cartão</label>
          <input type="text" id="cc-nome" placeholder="Como aparece no cartão">
        </div>
        <div class="ck-campo full">
          <label>Parcelas</label>
          <select id="cc-parcelas">
            <option value="1">1× sem juros</option>
            <option value="2">2× sem juros</option>
            <option value="3">3× sem juros</option>
            <option value="6">6× sem juros</option>
            <option value="12">12× sem juros</option>
          </select>
        </div>
      </div>
    </div>

    <button class="ck-btn-pagar" id="ck-btn-pagar">
      <span id="ck-btn-texto">Finalizar pedido</span>
    </button>

    <!-- PIX resultado -->
    <div class="ck-pix-resultado" id="ck-pix-resultado" style="display:none">
      <div class="pix-icon">🔳</div>
      <h4>Pague com PIX</h4>
      <div class="qr-wrap" id="ck-qr-code"></div>
      <p class="pix-instr">Escaneie o QR Code ou copie o código abaixo:</p>
      <div class="pix-copia">
        <input type="text" id="ck-pix-codigo" readonly>
        <button id="ck-btn-copiar">Copiar</button>
      </div>
      <p class="pix-val" id="ck-pix-validade"></p>
      <div class="pix-aguard">
        <span class="pulso"></span> Aguardando pagamento…
      </div>
    </div>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="javascript/carrinho.js"></script>
<script src="https://sdk.mercadopago.com/js/v2"></script>
<script src="javascript/checkout_page.js"></script>
</body>
</html>
