<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Conta — Desejo Rosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/minha-conta.css">
<style>
  /* Esconde o header original — o header.js injeta o global */
  .mc-header { display: none !important; }
  /* Garante que o conteúdo não fique atrás do header global */
  .mc-main { padding-top: 32px; }
</style>
</head>
<body>

<!-- Header original ocultado; header.js injeta o topo global -->
<header class="mc-header">
  <a href="index.html" class="mc-logo">
    <img src="topo.png" alt="Desejo Rosa" style="height:36px;border-radius:4px;display:block;">
  </a>
  <nav class="mc-nav">
    <a href="index.html">← Continuar comprando</a>
    <button class="btn-sair" id="btnSair">Sair</button>
  </nav>
</header>

<main class="mc-main">

  <!-- Sidebar -->
  <aside class="mc-sidebar">
    <div class="mc-perfil">
      <div class="mc-avatar" id="mc-avatar">?</div>
      <p class="mc-nome" id="mc-nome">Carregando...</p>
      <p class="mc-email" id="mc-email"></p>
    </div>
    <nav class="mc-menu">
      <a class="mc-menu-item ativo" data-tab="pedidos">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        Meus pedidos
      </a>
      <a class="mc-menu-item" data-tab="dados">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Meus dados
      </a>
    </nav>
  </aside>

  <!-- Conteúdo -->
  <section class="mc-conteudo">

    <!-- ABA PEDIDOS -->
    <div class="mc-tab ativo" id="tab-pedidos">
      <div class="mc-tab-header">
        <h2>Meus pedidos</h2>
        <p id="total-pedidos"></p>
      </div>
      <div class="mc-extrato">
        <div class="extrato-card">
          <span class="extrato-icon">💳</span>
          <div>
            <p class="extrato-label">Total gasto</p>
            <p class="extrato-val" id="extrato-valor">R$ 0,00</p>
          </div>
        </div>
      </div>
      <div id="lista-pedidos"></div>
    </div>

    <!-- ABA DADOS -->
    <div class="mc-tab" id="tab-dados">
      <div class="mc-tab-header">
        <h2>Meus dados</h2>
        <p>Atualize suas informações</p>
      </div>
      <div class="mc-form">
        <div class="mc-campo">
          <label>Nome completo</label>
          <input type="text" id="dados-nome" placeholder="Seu nome">
        </div>
        <div class="mc-campo">
          <label>E-mail</label>
          <input type="email" id="dados-email" placeholder="seu@email.com" readonly>
        </div>
        <div class="mc-campo">
          <label>Nova senha <span style="font-weight:300;font-size:11px">(deixe em branco para manter)</span></label>
          <input type="password" id="dados-senha" placeholder="Nova senha">
        </div>
        <button class="btn-salvar" id="btn-salvar-dados">Salvar alterações</button>
        <div id="dados-msg" style="display:none;margin-top:12px;font-size:13px;color:#276749"></div>
      </div>
    </div>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="javascript/header.js"></script>
<script src="javascript/minha-conta.js"></script>
<script>injetarHeader("loja");</script>
</body>
</html>
